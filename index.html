    <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebSite", "name": "Ideon \u2014 Turn ideas into researched plans", "description": "Turn your business idea into a researched plan. Live market research, a structured business plan, and a 30-day roadmap \u2014 in minutes."}</script>
    <!-- seo:end -->
    <!-- Theme applied BEFORE first paint so fresh/incognito sessions never
         flash the dark palette. Defaults to light; dark remains available via
         the toggle. Mirrored in src/main.tsx for the same reason. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ideon-theme') || localStorage.getItem('bcp-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          if (stored) localStorage.removeItem('bcp-theme');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
